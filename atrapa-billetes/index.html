<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lluvia de Billetes</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="billetes.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div id="contenedor">
        <div id="areaJuego">
            <div id="capaCubo">
                <div id="cubo"></div>
            </div>
            <div id="capaGotas">
                <div id="gota1" class="gota"></div>
            </div>
            <div id="errores">
                <div id="1"><i class="bi bi-cash"></i></div>
                <div id="2"><i class="bi bi-cash"></i></div>
                <div id="3"><i class="bi bi-cash"></i></div>
                <div id="4"><i class="bi bi-cash"></i></div>
                <div id="5"><i class="bi bi-cash"></i></div>
            </div>
            <div id="inicio">
                <h1>Recoge billetes</h1>
                <p>Mueve tu mano con las flechas izquierda y derecha para recoger los billetes antes de que caigan al suelo.</p>
                <button id="iniciarJuego">Iniciar</button>
            </div>
            <div id="final">
                <h1>Recoge billetes</h1>
                <p>¡Es hora de irse! Has recogido suficientes billetes y es hora de malgastarlos.</p>
                <button id="reiniciarJuego">Reiniciar</button>
            </div>
        </div>

        <a href="../index.html" class="btn-volver">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>
    <script src="billetes.js"></script>
</body>
</html>
