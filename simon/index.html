<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simón Dice - Zona Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <div id="contenedor">
        <h1>Simón Dice</h1>
        <p id="instrucciones">Observa la secuencia de colores y repítela en el mismo orden.</p>

        <div id="marcador">
            <div id="ronda">Ronda: 0</div>
            <div id="estado">Pulsa Iniciar</div>
        </div>

        <div id="tablero_simon">
            <div id="color0" class="boton-color verde" data-color="0"></div>
            <div id="color1" class="boton-color rojo" data-color="1"></div>
            <div id="color2" class="boton-color amarillo" data-color="2"></div>
            <div id="color3" class="boton-color azul" data-color="3"></div>
        </div>

        <div id="controles">
            <input type="button" id="btn_iniciar" value="Iniciar" onclick="iniciar_juego()">
        </div>

        <div id="fin_juego">
            <p id="mensaje_fin"></p>
            <input type="button" id="btn_reiniciar" value="Jugar otra vez" onclick="reiniciar_juego()">
        </div>
    </div>

    <a href="../index.html" class="btn-volver">
        <i class="bi bi-arrow-left"></i> Volver al inicio
    </a>

    <script src="simon.js"></script>
</body>
</html>
