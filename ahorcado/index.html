<!doctype html>
<html lang="es">
<head>
    <title>El Ahorcado</title>
    <meta lang="es">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="author" content="Isaac EA">
    <meta name="copyright" content="&copy, 2026 todos los derechos reservados">
    <meta name="keywords" content="ahorcado">
    <meta name="date" content="2026-06-09">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="ahorcado.css" media="all" />
</head>

<body>
    <div id="contenedor">
        <h1>¡Ayuda a este pobre hombre a liberarse!</h1>
        <h2>Adivina la palabra de cinco letras antes de 6 errores.</h2>

        <div id="fin_juego">
            <div id="mensaje"></div>
            <div id="reiniciar">
                <form>
                    <input id="boton" type="button" value="Intentarlo de nuevo" OnClick="reiniciar_juego()" />
                </form>
            </div>
        </div>

        <div id="monigote">
            <div id="cuerda">---|---</div>
            <div id="cabeza">O</div>
            <div id="brazo_izq">/</div>
            <div id="tronco">|</div>
            <div id="brazo_der">\</div>
            <div id="pierna_izq">/</div>
            <div id="pierna_der">\</div>
        </div>

        <div id="palabra">
            <div id="0" class="letra"></div>
            <div id="1" class="letra"></div>
            <div id="2" class="letra"></div>
            <div id="3" class="letra"></div>
            <div id="4" class="letra"></div>
        </div>

        <div id="informacion">
            <div id="info1">Partidas: 1</div>
            <div id="info2">Intentos: 0</div>
        </div>

        <div id="teclado"></div>

        <a href="../index.html" class="btn-volver">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>

    <script src="ahorcado.js"></script>
</body>
</html>
